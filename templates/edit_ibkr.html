<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit IBKR Trade #{{ trade.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Trading Tracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard & Chart</a>
                <a class="nav-link" href="/trades-list">View All Trades</a>
                <a class="nav-link active" href="/ibkr">IBKR Trades</a>
                <a class="nav-link" href="/settings">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title mb-3">Edit IBKR Trade #{{ trade.id }}</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Ticker Symbol</label>
                            <input type="text" class="form-control" name="ticker" value="{{ trade.ticker }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Time Entered</label>
                            <input type="datetime-local" class="form-control" name="time_entered" value="{{ trade.time_entered }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Time Exited</label>
                            <input type="datetime-local" class="form-control" name="time_exited" value="{{ trade.time_exited }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Entry Price ($)</label>
                            <input type="number" step="any" class="form-control" name="entry_price" value="{{ trade.entry_price }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Exit Price ($)</label>
                            <input type="number" step="any" class="form-control" name="exit_price" value="{{ trade.exit_price }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Profit & Loss ($)</label>
                            <input type="number" step="any" class="form-control" name="pnl" value="{{ trade.pnl }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ending Balance ($)</label>
                            <input type="number" step="any" class="form-control" name="balance" value="{{ trade.balance }}" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2">Update Trade</button>
                        <a href="/ibkr" class="btn btn-secondary w-100">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
