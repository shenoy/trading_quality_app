<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoring Rules Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Trading Tracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard & Charts</a>
                <a class="nav-link" href="/trades-list">View All Trades</a>
                <a class="nav-link active" href="/settings">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <h2 class="mb-4">Scoring Rules Configuration</h2>
        
        <div class="card shadow-sm p-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Category</th>
                            <th>Condition</th>
                            <th>Current Thresholds / Value</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for rule in rules %}
                        <tr>
                            <td>{{ rule.id }}</td>
                            <td><strong>{{ rule.category }}</strong></td>
                            <td>{{ rule.condition }}</td>
                            <td><span class="badge bg-info text-dark">{{ rule.points }}</span></td>
                            <td>
                                <a href="/settings/edit/{{ rule.id }}" class="btn btn-sm btn-warning">Edit</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
