<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Quality & Balance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
            transition: height 0.3s ease;
        }
        .chart-container.small { height: 220px; }
        .chart-container.medium { height: 350px; }
        .chart-container.large { height: 520px; }
    </style>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='tracker.svg') }}">
<style>
    body.wallpaper-bg {
        /* Link to your image in the static folder using Flask's url_for */
        background-image: url("{{ url_for('static', filename='images/ocean.jpg') }}");
        background-size: cover;         /* Scales image to cover the entire screen */
        background-position: center;     /* Centers the image */
        background-repeat: no-repeat;    /* Prevents tiling */
        background-attachment: fixed;    /* Keeps background locked in place while scrolling */
        min-height: 100vh;
    }

    /* Optional: Makes your cards slightly translucent so they pop nicely over the wallpaper */
    body.wallpaper-bg .card {
        background-color: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(8px);
    }
</style>

</head>
<body class="wallpaper-bg">
 <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Trading Tracker</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/">Dashboard & Charts</a>
            <a class="nav-link" href="/trades-list">View All Trades</a>
            <a class="nav-link" href="/ibkr">IBKR Trades</a>
            <a class="nav-link" href="/settings">Settings</a>
        </div>
    </div>
    </nav>

    <div class="container py-3">
        <!-- Header row with title and Log Trade button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">Trading Quality & Balance Dashboard</h1>
            <a href="/new-trade" class="btn btn-primary btn-lg shadow-sm">➕ Log New Trade</a>
        </div>

        <!-- Charts Column -->
        <div class="row g-4">
            <div class="col-12 d-flex flex-column gap-4">
                <!-- Chart 1: Quality & Equity -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Quality & Equity Balance</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('qualityWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('qualityWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('qualityWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="qualityWrapper">
                        <canvas id="qualityEquityChart"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Risk Amount -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Risk Amount ($)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('riskWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('riskWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('riskWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="riskWrapper">
                        <canvas id="riskChart"></canvas>
                    </div>
                </div>

                <!-- Chart 3: Risk:Reward -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Risk:Reward (R:R)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('rrWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('rrWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('rrWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="rrWrapper">
                        <canvas id="rrChart"></canvas>
                    </div>
                </div>

                <!-- Chart 4: Daily Profit & Loss -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Daily Profit & Loss ($)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('dailyPLWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('dailyPLWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('dailyPLWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="dailyPLWrapper">
                        <canvas id="dailyPLChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let qualityChartInstance = null;
        let riskChartInstance = null;
        let rrChartInstance = null;
        let dailyPLChartInstance = null;

        function resizeChart(wrapperId, size, event) {
            const wrapper = document.getElementById(wrapperId);
            const card = wrapper.closest('.card');
            const buttons = card.querySelectorAll('.btn-group .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            wrapper.classList.remove('small', 'medium', 'large');
            wrapper.classList.add(size);

            if (wrapperId === 'qualityWrapper' && qualityChartInstance) {
                qualityChartInstance.resize();
            } else if (wrapperId === 'riskWrapper' && riskChartInstance) {
                riskChartInstance.resize();
            } else if (wrapperId === 'rrWrapper' && rrChartInstance) {
                rrChartInstance.resize();
            } else if (wrapperId === 'dailyPLWrapper' && dailyPLChartInstance) {
                dailyPLChartInstance.resize();
            }
        }

        async function fetchAndRenderData() {
            const response = await fetch('/api/trades');
            const data = await response.json();

            const labels = data.map((t, index) => `Trade #${index + 1}`);
            const qualityScores = data.map(t => parseFloat(t.total_score) || 0);
            const equities = data.map(t => parseFloat(t.current_equity) || 0);
            const risks = data.map(t => parseFloat(t.risk_val) || 0);
            const riskRewards = data.map(t => parseFloat(t.risk_reward_str) || 0);

            const tickers = data.map(t => t.ticker);
            const datetimes = data.map(t => t.entry_datetime.replace('T', ' '));

            // 1. Calculate Cumulative Averages (Running Average)
            let runningRiskSum = 0;
            const cumulativeRiskData = risks.map((val, idx) => {
                runningRiskSum += val;
                return parseFloat((runningRiskSum / (idx + 1)).toFixed(2));
            });

            let runningRRSum = 0;
            const cumulativeRRData = riskRewards.map((val, idx) => {
                runningRRSum += val;
                return parseFloat((runningRRSum / (idx + 1)).toFixed(2));
            });

            // 2. Calculate 10-Trade Moving Averages
            const windowSize = 10;
            const movingAvgRiskData = risks.map((val, idx, arr) => {
                const start = Math.max(0, idx - windowSize + 1);
                const windowSlice = arr.slice(start, idx + 1);
                const sum = windowSlice.reduce((a, b) => a + b, 0);
                return parseFloat((sum / windowSlice.length).toFixed(2));
            });

            const movingAvgRRData = riskRewards.map((val, idx, arr) => {
                const start = Math.max(0, idx - windowSize + 1);
                const windowSlice = arr.slice(start, idx + 1);
                const sum = windowSlice.reduce((a, b) => a + b, 0);
                return parseFloat((sum / windowSlice.length).toFixed(2));
            });

            // 3. Aggregate Daily Profit & Loss
            const dailyPLMap = {};
            data.forEach(t => {
                if (!t.entry_datetime) return;
                const dateStr = t.entry_datetime.split('T')[0]; // Extract YYYY-MM-DD
                const risk = parseFloat(t.risk_val) || 0;
                const rr = parseFloat(t.risk_reward_str) || 0;
                const pl = risk * rr;

                if (!dailyPLMap[dateStr]) {
                    dailyPLMap[dateStr] = 0;
                }
                dailyPLMap[dateStr] += pl;
            });

            const sortedDates = Object.keys(dailyPLMap).sort();
            const dailyPLValues = sortedDates.map(date => parseFloat(dailyPLMap[date].toFixed(2)));
            const dailyColors = dailyPLValues.map(val => val >= 0 ? 'rgba(40, 167, 69, 0.7)' : 'rgba(220, 53, 69, 0.7)');

            const commonTooltipOptions = {
                plugins: {
                    tooltip: {
                        callbacks: {
                            title: function(context) {
                                const index = context[0].dataIndex;
                                return `Trade #${index + 1}: ${tickers[index]} (${datetimes[index]})`;
                            }
                        }
                    }
                }
            };

            // Chart 1: Quality & Equity
            const ctx1 = document.getElementById('qualityEquityChart').getContext('2d');
            if (qualityChartInstance) qualityChartInstance.destroy();

            qualityChartInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                    {
                        type: 'bar',
                        order: 2,  
                        label: 'Quality Score',
                        data: qualityScores,
                        borderColor: 'rgba(54, 162, 235, 1)',      
                        backgroundColor: 'rgba(54, 162, 235, 0.7)', 
                        yAxisID: 'y',
                        tension: 0.1
                    },
                    {
                        type: 'line',
                        order: 1,  
                        label: 'Equity Balance ($)',
                        data: equities,
                        borderColor: 'rgba(255, 99, 132, 1)',      
                        backgroundColor: 'rgba(255, 99, 132, 0.2)', 
                        yAxisID: 'y1',
                        tension: 0.1
                    }
                ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...commonTooltipOptions,
                    scales: {
                        x: { title: { display: true, text: 'Trade Sequence' } },
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Quality Score' } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Equity Balance ($)' } }
                    }
                }
            });

            // Chart 2: Risk Amount
            const ctx2 = document.getElementById('riskChart').getContext('2d');
            if (riskChartInstance) riskChartInstance.destroy();

            riskChartInstance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: 'Risk Amount ($)',
                            data: risks,
                            backgroundColor: 'rgba(255, 159, 64, 0.7)',
                            order: 3
                        }, 
                        {
                            type: 'line',
                            label: 'Cumulative Avg Risk ($)',
                            data: cumulativeRiskData,
                            borderColor: 'rgba(255, 99, 132, 1)', 
                            backgroundColor: 'rgba(255, 99, 132, 0)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 2,
                            order: 2,
                            tension: 0.1
                        },
                        {
                            type: 'line',
                            label: '10-Trade Moving Avg Risk ($)',
                            data: movingAvgRiskData,
                            borderColor: 'rgba(54, 162, 235, 1)', 
                            backgroundColor: 'rgba(54, 162, 235, 0)',
                            borderWidth: 2,
                            pointRadius: 2,
                            order: 1,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...commonTooltipOptions,
                    scales: {
                        x: { title: { display: true, text: 'Trade Sequence' } },
                        y: { beginAtZero: true, title: { display: true, text: 'Risk Amount ($)' } }
                    }
                }
            });

            // Chart 3: Risk:Reward
            const ctx3 = document.getElementById('rrChart').getContext('2d');
            if (rrChartInstance) rrChartInstance.destroy();

            rrChartInstance = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: 'Risk:Reward (R:R)',
                            data: riskRewards,
                            backgroundColor: 'rgba(153, 102, 255, 0.7)',
                            order: 3
                        }, 
                        {
                            type: 'line',
                            label: 'Cumulative Avg R:R',
                            data: cumulativeRRData,
                            borderColor: 'rgba(255, 99, 132, 1)', 
                            backgroundColor: 'rgba(255, 99, 132, 0)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 2,
                            order: 2,
                            tension: 0.1
                        },
                        {
                            type: 'line',
                            label: '10-Trade Moving Avg R:R',
                            data: movingAvgRRData,
                            borderColor: 'rgba(54, 162, 235, 1)', 
                            backgroundColor: 'rgba(54, 162, 235, 0)',
                            borderWidth: 2,
                            pointRadius: 2,
                            order: 1,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...commonTooltipOptions,
                    scales: {
                        x: { title: { display: true, text: 'Trade Sequence' } },
                        y: { title: { display: true, text: 'Risk:Reward Ratio' } }
                    }
                }
            });

            // Chart 4: Daily Profit & Loss
            const ctx4 = document.getElementById('dailyPLChart').getContext('2d');
            if (dailyPLChartInstance) dailyPLChartInstance.destroy();

            dailyPLChartInstance = new Chart(ctx4, {
                type: 'bar',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Daily P&L ($)',
                        data: dailyPLValues,
                        backgroundColor: dailyColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return `Date: ${context[0].label}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Date' } },
                        y: { title: { display: true, text: 'Profit / Loss ($)' } }
                    }
                }
            });
        }

        fetchAndRenderData();
    </script>

</body>
</html>
