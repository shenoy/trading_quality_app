<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Quality & Balance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
            transition: height 0.3s ease;
        }
        .chart-container.small { height: 220px; }
        .chart-container.medium { height: 350px; }
        .chart-container.large { height: 520px; }
    </style>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='tracker.svg') }}">

</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Trading Tracker</a>
        <div class="navbar-nav">
                <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='tracker.svg') }}" alt="Trading Tracker Logo" height="35">
                </a>
            <a class="nav-link active" href="/">Dashboard & Charts</a>
            <a class="nav-link" href="/trades-list">View All Trades</a>
            <a class="nav-link" href="/ibkr">IBKR Trades</a>
            <a class="nav-link" href="/settings">Settings</a>
        </div>
    </div>
    </nav>

    <div class="container py-3">
        <!-- Header row with title and Log Trade button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">Trading Quality & Balance Dashboard</h1>
            <a href="/new-trade" class="btn btn-primary btn-lg shadow-sm">➕ Log New Trade</a>
        </div>

        <!-- Charts Column -->
        <div class="row g-4">
            <div class="col-12 d-flex flex-column gap-4">
                <!-- Chart 1: Quality & Equity -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Quality & Equity Balance</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('qualityWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('qualityWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('qualityWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="qualityWrapper">
                        <canvas id="qualityEquityChart"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Risk & Risk:Reward -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">Risk & Risk:Reward (R:R)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('riskWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('riskWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('riskWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="riskWrapper">
                        <canvas id="riskRewardChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let qualityChartInstance = null;
        let riskChartInstance = null;

        function resizeChart(wrapperId, size, event) {
            const wrapper = document.getElementById(wrapperId);
            const card = wrapper.closest('.card');
            const buttons = card.querySelectorAll('.btn-group .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            wrapper.classList.remove('small', 'medium', 'large');
            wrapper.classList.add(size);

            if (wrapperId === 'qualityWrapper' && qualityChartInstance) {
                qualityChartInstance.resize();
            } else if (wrapperId === 'riskWrapper' && riskChartInstance) {
                riskChartInstance.resize();
            }
        }

        async function fetchAndRenderData() {
            const response = await fetch('/api/trades');
            const data = await response.json();

            const labels = data.map((t, index) => `Trade #${index + 1}`);
            const qualityScores = data.map(t => parseFloat(t.total_score) || 0);
            const equities = data.map(t => parseFloat(t.current_equity) || 0);
            const risks = data.map(t => parseFloat(t.risk_val) || 0);
            const riskRewards = data.map(t => parseFloat(t.risk_reward_str) || 0);

            const tickers = data.map(t => t.ticker);
            const datetimes = data.map(t => t.entry_datetime.replace('T', ' '));

            const commonTooltipOptions = {
                plugins: {
                    tooltip: {
                        callbacks: {
                            title: function(context) {
                                const index = context[0].dataIndex;
                                return `Trade #${index + 1}: ${tickers[index]} (${datetimes[index]})`;
                            }
                        }
                    }
                }
            };

            // Chart 1
            const ctx1 = document.getElementById('qualityEquityChart').getContext('2d');
            if (qualityChartInstance) qualityChartInstance.destroy();

            qualityChartInstance = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                    {
                        label: 'Quality Score',
                        data: qualityScores,
                        borderColor: 'rgba(54, 162, 235, 1)',      // Blue
                        backgroundColor: 'rgba(54, 162, 235, 0.2)', // Blue
                        yAxisID: 'y',
                        tension: 0.1
                    },
                    {
                        label: 'Equity Balance ($)',
                        data: equities,
                        borderColor: 'rgba(255, 99, 132, 1)',      // Red
                        backgroundColor: 'rgba(255, 99, 132, 0.2)', // Red
                        yAxisID: 'y1',
                        tension: 0.1
                    }
                ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...commonTooltipOptions,
                    scales: {
                        x: { title: { display: true, text: 'Trade Sequence' } },
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Quality Score' } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Equity Balance ($)' } }
                    }
                }
            });

            // Chart 2
            const ctx2 = document.getElementById('riskRewardChart').getContext('2d');
            if (riskChartInstance) riskChartInstance.destroy();

            riskChartInstance = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Risk Amount ($)',
                            data: risks,
                            borderColor: 'rgba(255, 159, 64, 1)',
                            backgroundColor: 'rgba(255, 159, 64, 0.2)',
                            yAxisID: 'y',
                            tension: 0.1
                        },
                        {
                            label: 'Risk:Reward (R:R)',
                            data: riskRewards,
                            borderColor: 'rgba(153, 102, 255, 1)',
                            backgroundColor: 'rgba(153, 102, 255, 0.2)',
                            yAxisID: 'y1',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...commonTooltipOptions,
                    scales: {
                        x: { title: { display: true, text: 'Trade Sequence' } },
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Risk Amount ($)' } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Risk:Reward Ratio' } }
                    }
                }
            });
        }

        fetchAndRenderData();
    </script>
</body>
</html>
