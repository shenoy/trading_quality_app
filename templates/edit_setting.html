<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scoring Rule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Trading Tracker</a>
              <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard & Chart</a>
                <a class="nav-link active" href="/trades-list">View All Trades</a>
                <a class="nav-link" href="/ibkr">IBKR Trades</a>
                <a class="nav-link" href="/ibkr-charts">IBKR Charts</a>
                <a class="nav-link" href="/settings">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title mb-3">Edit Rule: {{ rule.category }}</h3>
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Points</label>
                            <input type="text" class="form-control" name="points" value="{{ rule.points }}" required>
                            <div class="form-text">{{ hint }}. Separate the numbers with "/" or ",".</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-2">Save Changes</button>
                        <a href="/settings" class="btn btn-secondary w-100">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
