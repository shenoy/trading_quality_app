<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBKR Performance Charts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
            transition: height 0.3s ease;
        }
        .chart-container.small { height: 220px; }
        .chart-container.medium { height: 350px; }
        .chart-container.large { height: 520px; }
        body.wallpaper-bg {
            background-image: url("{{ url_for('static', filename='images/ocean.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        body.wallpaper-bg .card {
            background-color: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(8px);
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='tracker.svg') }}">
</head>
<body class="wallpaper-bg">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Trading Tracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard & Chart</a>
                <a class="nav-link active" href="/trades-list">View All Trades</a>
                <a class="nav-link" href="/ibkr">IBKR Trades</a>
                <a class="nav-link" href="/ibkr-charts">IBKR Charts</a>
                <a class="nav-link" href="/accounts">Accounts</a>
                <a class="nav-link" href="/settings">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <!-- Header row -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">IBKR Performance Analytics</h1>
            <a href="/ibkr" class="btn btn-secondary shadow-sm">⬅ Back to IBKR Management</a>
        </div>

        <!-- Charts Container -->
        <div class="row g-4">
            <div class="col-12 d-flex flex-column gap-4">

                <!-- Chart 1: IBKR Account Balance -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">IBKR Account Balance ($)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('balanceWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('balanceWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('balanceWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="balanceWrapper">
                        <canvas id="ibkrBalanceChart"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Daily Profit & Loss -->
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">IBKR Daily Profit & Loss ($)</h4>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('dailyPLWrapper', 'small', event)">Small</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="resizeChart('dailyPLWrapper', 'medium', event)">Medium</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resizeChart('dailyPLWrapper', 'large', event)">Large</button>
                        </div>
                    </div>
                    <div class="chart-container medium" id="dailyPLWrapper">
                        <canvas id="ibkrDailyPLChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let balanceChartInstance = null;
        let dailyPLChartInstance = null;

        function resizeChart(wrapperId, size, event) {
            const wrapper = document.getElementById(wrapperId);
            const card = wrapper.closest('.card');
            const buttons = card.querySelectorAll('.btn-group .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            wrapper.classList.remove('small', 'medium', 'large');
            wrapper.classList.add(size);

            if (wrapperId === 'balanceWrapper' && balanceChartInstance) {
                balanceChartInstance.resize();
            } else if (wrapperId === 'dailyPLWrapper' && dailyPLChartInstance) {
                dailyPLChartInstance.resize();
            }
        }

        async function fetchAndRenderIBKRData() {
            try {
                const response = await fetch('/api/ibkr-trades');
                const data = await response.json();

                if (!data || data.length === 0) {
                    console.warn("No IBKR trades found.");
                    return;
                }

                // Prepare labels and datasets based on IBKR columns
                const labels = data.map((t, index) => `Trade #${index + 1} (${t.ticker || 'N/A'})`);
                const balances = data.map(t => parseFloat(t.balance) || 0);

                const tickers = data.map(t => t.ticker || '');
                const exitTimes = data.map(t => (t.time_exited || t.time_entered || '').replace('T', ' '));

                // Aggregate Daily P&L from trades using correct property names
                const dailyPLMap = {};
                data.forEach(t => {
                    const dateField = t.time_exited || t.time_entered;
                    if (!dateField) return;

                    // Handle dates whether they are full ISO strings or simple date strings
                    const dateStr = dateField.includes('T') ? dateField.split('T')[0] : dateField.split(' ')[0];

                    const pl = parseFloat(t.pnl ?? t.profit_loss ?? 0);

                    if (!dailyPLMap[dateStr]) {
                        dailyPLMap[dateStr] = 0;
                    }
                    dailyPLMap[dateStr] += pl;
                });

                const sortedDates = Object.keys(dailyPLMap).sort();
                const dailyPLValues = sortedDates.map(date => parseFloat(dailyPLMap[date].toFixed(2)));
                const dailyColors = dailyPLValues.map(val => val >= 0 ? 'rgba(40, 167, 69, 0.7)' : 'rgba(220, 53, 69, 0.7)');

                const commonTooltipOptions = {
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    const index = context[0].dataIndex;
                                    return `Trade #${index + 1}: ${tickers[index]} (${exitTimes[index]})`;
                                }
                            }
                        }
                    }
                };

                // 1. Render Balance Chart
                const ctx1 = document.getElementById('ibkrBalanceChart').getContext('2d');
                if (balanceChartInstance) balanceChartInstance.destroy();

                balanceChartInstance = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Account Balance ($)',
                            data: balances,
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        ...commonTooltipOptions,
                        scales: {
                            x: { title: { display: true, text: 'Trade Sequence' } },
                            y: { title: { display: true, text: 'Balance ($)' } }
                        }
                    }
                });

                // 2. Render Daily P&L Chart
                const ctx2 = document.getElementById('ibkrDailyPLChart').getContext('2d');
                if (dailyPLChartInstance) dailyPLChartInstance.destroy();

                dailyPLChartInstance = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: sortedDates,
                        datasets: [{
                            label: 'Daily Profit & Loss ($)',
                            data: dailyPLValues,
                            backgroundColor: dailyColors,
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    title: function(context) {
                                        return `Date: ${context[0].label}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { title: { display: true, text: 'Date' } },
                            y: { title: { display: true, text: 'Profit / Loss ($)' } }
                        }
                    }
                });

            } catch (error) {
                console.error("Error fetching IBKR chart data:", error);
            }
        }

        fetchAndRenderIBKRData();
    </script>
</body>
</html>
