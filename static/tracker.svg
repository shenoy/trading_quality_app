<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Dollar Bill Icon Container -->
  <g transform="translate(5, 5)">
    <!-- Dollar Bill Outer Border (Green theme) -->
    <rect width="40" height="40" rx="6" fill="#198754" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Inner Border Details -->
    <rect x="4" y="4" width="32" height="32" rx="3" fill="none" stroke="#d1e7dd" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Center Dollar Sign Symbol -->
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">$</text>
    <!-- Growth Trend Arrow Overlay -->
    <path d="M 6 34 L 15 25 L 23 29 L 34 14" stroke="#ffc107" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
